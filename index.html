<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mimogoshi</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="stage">

  <div class="layout-row">
  <div class="device" id="device">
    <div class="device-top">
      <span class="brand">MIMOGOSHI</span>
      <div class="device-top-right">
        <button class="debug-toggle" id="btnDebug" title="Modo prueba">🧪</button>
        <span class="led" id="led"></span>
      </div>
    </div>

    <div class="screen-bezel">
      <div class="screen" id="screen">
        <div class="screen-glow"></div>
        <div class="night-sky"></div>

        <div class="topbar">
          <div class="pet-name" id="petName">—</div>
          <div class="topbar-right">
            <button class="day-night" id="dayNight" title="De día">☀️</button>
            <span class="pet-coins" id="petCoins">💰 0</span>
            <span class="pet-age" id="petAge">Día 0</span>
          </div>
        </div>

        <div class="creature-floor" id="creatureFloor">
          <div class="deco-layer" id="decoLayer"></div>
          <div class="furni-layer" id="furniBack"></div>
          <div class="furni-layer" id="furniMid"></div>
          <canvas id="buddyCanvas" class="hidden" width="96" height="96"></canvas>
          <canvas id="petCanvas" width="96" height="96"></canvas>
          <div class="furni-layer" id="furniFront"></div>
          <span class="pet-hat hidden" id="petHat"></span>
          <div class="poop-fx hidden" id="poopFx">💩</div>
          <div class="gift-fx hidden" id="giftFx">🎁</div>
        </div>

        <div class="bubble" id="bubble"></div>

        <canvas id="gameCanvas" width="256" height="150" class="hidden"></canvas>

        <div class="stats" id="stats">
          <div class="stat" data-stat="hunger">
            <span class="stat-icon">🍖</span>
            <div class="stat-bar"><div class="stat-fill" id="fill-hunger"></div></div>
          </div>
          <div class="stat" data-stat="happiness">
            <span class="stat-icon">⭐</span>
            <div class="stat-bar"><div class="stat-fill" id="fill-happiness"></div></div>
          </div>
          <div class="stat" data-stat="energy">
            <span class="stat-icon">⚡</span>
            <div class="stat-bar"><div class="stat-fill" id="fill-energy"></div></div>
          </div>
          <div class="stat" data-stat="hygiene">
            <span class="stat-icon">🧼</span>
            <div class="stat-bar"><div class="stat-fill" id="fill-hygiene"></div></div>
          </div>
          <div class="stat" data-stat="health">
            <span class="stat-icon">❤️</span>
            <div class="stat-bar"><div class="stat-fill" id="fill-health"></div></div>
          </div>
        </div>

      </div>
    </div>

    <!-- Abajo, dos niveles: los cuatro cuidados de todos los días, grandes, y
         lo de vez en cuando (tienda, personalizar, reiniciar) en píldoras.
         La bandeja de comidas flota encima de todo esto sin cambiar el alto. -->
    <div class="controls" id="controls">
      <div class="dock">
        <button class="btn" id="btnFeed" title="Comer">
          <span class="btn-icon">🍽️</span><span class="btn-label">Comer</span>
        </button>
        <button class="btn" id="btnPlay" title="Jugar">
          <span class="btn-icon">🎮</span><span class="btn-label">Jugar</span>
        </button>
        <button class="btn" id="btnClean" title="Limpiar">
          <span class="btn-icon">🧹</span><span class="btn-label">Limpiar</span>
        </button>
        <button class="btn" id="btnSleep" title="Dormir">
          <span class="btn-icon" id="sleepIcon">🌙</span><span class="btn-label" id="sleepLabel">Dormir</span>
        </button>
      </div>
      <div class="dock-sec">
        <button class="pill" id="btnShop" title="Tienda">🛒 Tienda</button>
        <button class="pill" id="btnStyle" title="Personalizar">🎨 Personalizar</button>
        <button class="pill pill-icon" id="btnReset" title="Reiniciar">↺</button>
      </div>
      <div class="food-tray hidden" id="foodTray"></div>
    </div>

    <!-- Reemplaza a .controls mientras dura un minijuego: los mandos del juego
         viven acá abajo y no encima de la pantalla. -->
    <div class="game-controls hidden" id="gameControls"></div>

    <div class="speaker">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Los menús cubren el aparato entero (hoja que sube desde abajo), no
         solo la pantalla LCD: ahí adentro no entraban más de dos filas. -->
    <div class="overlay hidden" id="overlay">
      <div class="overlay-card" id="overlayCard"></div>
    </div>
  </div>

  <aside class="debug-side hidden" id="debugPanel">
    <div class="debug-side-head">
      <span>🧪 Modo prueba</span>
      <button class="debug-close" id="btnCloseDebugSide" title="Cerrar">✕</button>
    </div>
    <div id="debugPanelBody"></div>
  </aside>
  </div>

</div>

<script src="app.js"></script>
<script src="muebles.js"></script>
<script src="duo.js"></script>
<script src="duo-juegos.js"></script>
</body>
</html>
