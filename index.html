<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mimogoshi</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="stage">

  <div class="layout-row">
  <div class="device" id="device">
    <div class="device-top">
      <span class="brand">MIMOGOSHI</span>
      <div class="device-top-right">
        <button class="debug-toggle" id="btnSettings" title="Configuración" aria-label="Configuración">⚙️</button>
        <button class="debug-toggle" id="btnDebug" title="Modo prueba">🧪</button>
        <span class="led" id="led"></span>
      </div>
    </div>

    <div class="screen-bezel">
      <div class="screen" id="screen">
        <div class="screen-glow"></div>
        <div class="night-sky"></div>

        <div class="topbar">
          <div class="pet-name" id="petName">—</div>
          <div class="topbar-right">
            <button class="day-night" id="dayNight" title="De día"><i class="px-icon px-sun"></i><i class="px-icon px-moon"></i></button>
            <span class="pet-coins"><i class="px-icon px-coin"></i><span id="petCoins">0</span></span>
            <span class="pet-age" id="petAge">Día 0</span>
          </div>
        </div>

        <div class="creature-floor" id="creatureFloor">
          <div class="deco-layer" id="decoLayer"></div>
          <div class="furni-layer" id="furniBack"></div>
          <div class="furni-layer" id="furniMid"></div>
          <canvas id="buddyCanvas" class="hidden" width="96" height="96"></canvas>
          <canvas id="petCanvas" width="96" height="96"></canvas>
          <div class="furni-layer" id="furniFront"></div>
          <span class="pet-hat hidden" id="petHat"></span>
          <div class="poop-fx hidden" id="poopFx">💩</div>
          <div class="gift-fx hidden" id="giftFx">🎁</div>
          <!-- Bitácora: un ícono pegado al borde que pestañea al volver si
               pasó algo mientras no estabas; tocarlo abre la lista. Va dentro
               del piso para que se esconda solo durante los minijuegos. -->
          <button class="log-btn" id="logBtn" title="Bitácora" aria-label="Bitácora"><i class="px-icon px-log"></i></button>
          <!-- Habitaciones: flechas a los costados y puntitos arriba, solo si
               hay más de una (ver goRoom en muebles.js). -->
          <button class="room-arrow prev hidden" id="roomPrev" aria-label="Habitación anterior">‹</button>
          <button class="room-arrow next hidden" id="roomNext" aria-label="Habitación siguiente">›</button>
          <div class="room-dots hidden" id="roomDots"></div>
        </div>

        <div class="bubble" id="bubble"></div>
        <div class="log-panel hidden" id="logPanel"></div>

        <canvas id="gameCanvas" width="256" height="150" class="hidden"></canvas>

        <!-- Relojes en el mismo orden que el dock de abajo: cada uno queda
             encima de su botón (energía-Dormir, higiene-Limpiar,
             felicidad-Jugar, hambre-Comer) y la salud, que no tiene botón
             porque es el resultado de las otras, más grande al medio. -->
        <div class="stats" id="stats">
          <div class="stat" data-stat="energy">
            <div class="stat-ring">
              <svg viewBox="0 0 50 50" aria-hidden="true">
                <circle class="stat-disc" cx="25" cy="25" r="17.5"/>
                <circle class="stat-track" cx="25" cy="25" r="21" pathLength="100"/>
                <circle class="stat-fill" id="fill-energy" cx="25" cy="25" r="21" pathLength="100"/>
                <circle class="stat-shine" id="shine-energy" cx="25" cy="25" r="22.2" pathLength="100"/>
                <circle class="stat-inner" cx="25" cy="25" r="17.6"/>
                <circle class="stat-spark" cx="25" cy="25" r="21" pathLength="100"/>
              </svg>
              <span class="stat-icon"><i class="px-icon px-energy"></i></span>
            </div>
            <span class="stat-num" id="num-energy"></span>
          </div>
          <div class="stat" data-stat="hygiene">
            <div class="stat-ring">
              <svg viewBox="0 0 50 50" aria-hidden="true">
                <circle class="stat-disc" cx="25" cy="25" r="17.5"/>
                <circle class="stat-track" cx="25" cy="25" r="21" pathLength="100"/>
                <circle class="stat-fill" id="fill-hygiene" cx="25" cy="25" r="21" pathLength="100"/>
                <circle class="stat-shine" id="shine-hygiene" cx="25" cy="25" r="22.2" pathLength="100"/>
                <circle class="stat-inner" cx="25" cy="25" r="17.6"/>
              </svg>
              <span class="stat-icon"><i class="px-icon px-hygiene"></i></span>
            </div>
            <span class="stat-num" id="num-hygiene"></span>
          </div>
          <div class="stat main" data-stat="health">
            <div class="stat-ring">
              <svg viewBox="0 0 50 50" aria-hidden="true">
                <circle class="stat-disc" cx="25" cy="25" r="17.5"/>
                <circle class="stat-track" cx="25" cy="25" r="21" pathLength="100"/>
                <circle class="stat-fill" id="fill-health" cx="25" cy="25" r="21" pathLength="100"/>
                <circle class="stat-shine" id="shine-health" cx="25" cy="25" r="22.2" pathLength="100"/>
                <circle class="stat-inner" cx="25" cy="25" r="17.6"/>
              </svg>
              <span class="stat-icon"><i class="px-icon px-health"></i></span>
            </div>
            <span class="stat-num" id="num-health"></span>
          </div>
          <div class="stat" data-stat="happiness">
            <div class="stat-ring">
              <svg viewBox="0 0 50 50" aria-hidden="true">
                <circle class="stat-disc" cx="25" cy="25" r="17.5"/>
                <circle class="stat-track" cx="25" cy="25" r="21" pathLength="100"/>
                <circle class="stat-fill" id="fill-happiness" cx="25" cy="25" r="21" pathLength="100"/>
                <circle class="stat-shine" id="shine-happiness" cx="25" cy="25" r="22.2" pathLength="100"/>
                <circle class="stat-inner" cx="25" cy="25" r="17.6"/>
              </svg>
              <span class="stat-icon"><i class="px-icon px-happiness"></i></span>
            </div>
            <span class="stat-num" id="num-happiness"></span>
          </div>
          <div class="stat" data-stat="hunger">
            <div class="stat-ring">
              <svg viewBox="0 0 50 50" aria-hidden="true">
                <circle class="stat-disc" cx="25" cy="25" r="17.5"/>
                <circle class="stat-track" cx="25" cy="25" r="21" pathLength="100"/>
                <circle class="stat-fill" id="fill-hunger" cx="25" cy="25" r="21" pathLength="100"/>
                <circle class="stat-shine" id="shine-hunger" cx="25" cy="25" r="22.2" pathLength="100"/>
                <circle class="stat-inner" cx="25" cy="25" r="17.6"/>
              </svg>
              <span class="stat-icon"><i class="px-icon px-hunger"></i></span>
            </div>
            <span class="stat-num" id="num-hunger"></span>
          </div>
        </div>

      </div>
    </div>

    <!-- Abajo, dos niveles: los cuatro cuidados de todos los días, grandes
         (en el mismo orden que los relojes de la pantalla), y
         lo de vez en cuando (tienda, personalizar, ruleta, reiniciar) en píldoras.
         La bandeja de comidas flota encima de todo esto sin cambiar el alto. -->
    <div class="controls" id="controls">
      <div class="dock">
        <button class="btn" id="btnSleep" title="Dormir">
          <span class="btn-icon" id="sleepIcon">🌙</span><span class="btn-label" id="sleepLabel">Dormir</span>
        </button>
        <button class="btn" id="btnClean" title="Limpiar">
          <span class="btn-icon">🧹</span><span class="btn-label">Limpiar</span>
        </button>
        <button class="btn" id="btnPlay" title="Jugar">
          <span class="btn-icon">🎮</span><span class="btn-label">Jugar</span>
        </button>
        <button class="btn" id="btnFeed" title="Comer">
          <span class="btn-icon">🍽️</span><span class="btn-label">Comer</span>
        </button>
      </div>
      <!-- La ruleta vive dentro de Juegos y Reiniciar en la configuración (⚙️ de
           arriba): aquí quedan solo las dos cosas de vez en cuando. -->
      <div class="dock-sec">
        <button class="pill" id="btnStyle" title="Personalizar"><span class="pill-icon">🎨</span>Personalizar</button>
        <button class="pill" id="btnShop" title="Tienda"><span class="pill-icon">🛒</span>Tienda</button>
      </div>
      <div class="food-tray hidden" id="foodTray"></div>
    </div>

    <!-- Reemplaza a .controls mientras dura un minijuego: los mandos del juego
         viven acá abajo y no encima de la pantalla. -->
    <div class="game-controls hidden" id="gameControls"></div>

    <!-- Los menús cubren el aparato entero (hoja que sube desde abajo), no
         solo la pantalla LCD: ahí adentro no entraban más de dos filas. -->
    <div class="overlay hidden" id="overlay">
      <div class="overlay-card" id="overlayCard"></div>
    </div>

    <!-- Pop-up de compra y de premio: encima de todo, también de la hoja de
         la tienda (showPopup en app.js). -->
    <div class="popup hidden" id="popup"></div>
  </div>

  <aside class="debug-side hidden" id="debugPanel">
    <div class="debug-side-head">
      <span>🧪 Modo prueba</span>
      <button class="debug-close" id="btnCloseDebugSide" title="Cerrar">✕</button>
    </div>
    <div id="debugPanelBody"></div>
  </aside>
  </div>

</div>

<script src="app.js"></script>
<script src="juegos.js"></script>
<script src="premios.js"></script>
<script src="muebles.js"></script>
<script src="duo.js"></script>
<script src="duo-juegos.js"></script>
</body>
</html>
